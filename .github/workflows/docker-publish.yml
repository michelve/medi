# Build, test, and publish the medi container image to GitHub Container Registry
# (GHCR) so the Unraid template's `ghcr.io/michelve/medi:latest` resolves.
#
# The image is Linux/glibc and compiles the Rust backend, so it cannot be built
# on the Windows dev box (docker/README.md). This workflow is the canonical build.
#
# ── Release model (Unraid-friendly) ─────────────────────────────────────────
#   • Every push to `main` and every PR runs the CI gate (`test`): backend tests +
#     web typecheck/build. A red gate blocks the image job, so a broken commit
#     never becomes a published image.
#   • Push to `main`  → build the image and publish **`edge`** + a `sha-…` tag.
#     `:latest` is NOT moved — Unraid's "Check for Updates" stays quiet on dev pushes.
#   • Push a tag `vX.Y.Z` → publish **`latest`** + the semver tags (X.Y.Z, X.Y, X)
#     + `sha-…`. This is the only thing that moves `:latest`, so an Unraid update
#     prompt means a real release. (Cut a release with:  git tag v0.2.0 && git push --tags)
#   • Pull requests build the image to validate the Dockerfile but never push.
#
# One-time after the first successful tag run: open
#   https://github.com/michelve/medi/pkgs/container/medi
# and set the package visibility to Public, so Unraid can pull without auth.
name: docker-publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # Manual re-run button in the Actions tab.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Lower-cased owner/repo. GHCR requires a lower-case image name; `michelve/medi`
  # already is, and the metadata action lower-cases it regardless.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── CI gate ────────────────────────────────────────────────────────────────
  # Compile + test the backend and typecheck/build the web SPA. Mirrors exactly
  # what the Dockerfile builds (release binary + `@medi/web` dist), so a green gate
  # means the image will build and run known-good code. Runs for pushes AND PRs.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -- Backend: cargo test the whole workspace --
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: cargo test (workspace)
        working-directory: backend
        run: cargo test --workspace --locked

      # -- Web client: typecheck + production build (same as the Docker web stage) --
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: yarn install (frozen)
        working-directory: client
        run: corepack enable && yarn install --frozen-lockfile
      - name: Typecheck workspaces
        working-directory: client
        run: |
          yarn workspace @medi/api-client typecheck
          yarn workspace @medi/player typecheck
          yarn workspace @medi/web typecheck
      - name: Build web SPA
        working-directory: client
        run: yarn workspace @medi/web build

  # ── Image ──────────────────────────────────────────────────────────────────
  # Depends on the gate. Pushes to GHCR for `main` (edge) and tags (release); a PR
  # build validates the Dockerfile without pushing.
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR via the built-in GITHUB_TOKEN

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU + Buildx give us multi-arch capability and BuildKit cache. Unraid is
      # x86_64, so we build linux/amd64 only (arm64 would need cross-built GPU
      # driver packages that Debian ships for amd64 first-class).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only log in when we intend to push (skipped for PRs from forks / read-only).
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag policy:
      #   • tag push  → latest + semver (X.Y.Z, X.Y, X)
      #   • main push → edge (latest is intentionally NOT emitted here)
      #   • any build → sha-<short> so every commit is pinnable
      - name: Compute tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: . # repo root; the Dockerfile COPYs backend/ and docker/
          file: docker/Dockerfile
          platforms: linux/amd64
          # Push for main + tags; PRs build only (validate the Dockerfile).
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
