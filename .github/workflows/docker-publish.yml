# Build the medi container image and publish it to GitHub Container Registry
# (GHCR) so the Unraid template's `ghcr.io/michelve/medi:latest` resolves.
#
# The image is Linux/glibc and compiles the Rust backend, so it cannot be built
# on the Windows dev box (docker/README.md). This workflow is the canonical build:
# it runs on GitHub's Linux runners on every push to main and on version tags.
#
# One-time after the first successful run: open
#   https://github.com/michelve/medi/pkgs/container/medi
# and set the package visibility to Public, so Unraid can pull without auth.
name: docker-publish

on:
  push:
    branches: [main]
    tags: ['v*']
  # Manual re-run button in the Actions tab.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Lower-cased owner/repo. GHCR requires a lower-case image name; `michelve/medi`
  # already is, and the metadata action lower-cases it regardless.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR via the built-in GITHUB_TOKEN

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU + Buildx give us multi-arch capability and BuildKit cache. Unraid is
      # x86_64, so we build linux/amd64 only (arm64 would need cross-built GPU
      # driver packages that Debian ships for amd64 first-class).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derives tags + OCI labels: `latest` for the default branch, the semver for
      # a `vX.Y.Z` tag (also X.Y and X), and the short SHA for every build so any
      # commit is pinnable.
      - name: Compute tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: . # repo root; the Dockerfile COPYs backend/ and docker/
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
