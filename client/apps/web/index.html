    <meta name="theme-color" content="#0b0b0f" />
    <!-- Inter is the detail-page design font (Figma). Loaded from Google Fonts with a
         preconnect; when the server runs offline the CSS stacks fall back to the system
         font (-apple-system / Segoe UI), so this is a progressive enhancement, not a hard
         dependency. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

  </head>

  </body>
